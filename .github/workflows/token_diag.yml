name: Token Diagnostic
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Compare tokens
        run: |
          IG="${{ secrets.INSTAGRAM_ACCESS_TOKEN }}"
          FB="${{ secrets.FACEBOOK_ACCESS_TOKEN }}"
          FB2="${{ secrets.FB_ACCESS_TOKEN }}"
          IG2="${{ secrets.IG_ACCESS_TOKEN }}"
          echo "IG == FB? $([ "$IG" = "$FB" ] && echo YES || echo NO)"
          echo "IG == IG_ALT? $([ "$IG" = "$IG2" ] && echo YES || echo NO)"
          echo "IG == FB_ALT? $([ "$IG" = "$FB2" ] && echo YES || echo NO)"
          echo "IG len: ${#IG}"
          echo "FB len: ${#FB}"
          echo "IG prefix: ${IG:0:4}"
          echo "FB prefix: ${FB:0:4}"
          echo "IG_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}"
          echo "IG_USER_ID: ${{ secrets.IG_USER_ID }}"
      - name: Debug IG token via Meta debug_token
        run: |
          curl -s -X GET "https://graph.facebook.com/v21.0/debug_token?input_token=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}&access_token=${{ secrets.FACEBOOK_ACCESS_TOKEN }}"
          echo ""
      - name: Try creating IG container with INSTAGRAM_ACCESS_TOKEN
        run: |
          curl -s -X POST "https://graph.facebook.com/v21.0/${{ secrets.INSTAGRAM_ACCOUNT_ID }}/media" \
            -d "media_type=REELS" -d "upload_type=resumable" -d "share_to_feed=false" \
            -d "access_token=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" -d "caption=diag test"
          echo ""
      - name: Try creating IG container with FACEBOOK_ACCESS_TOKEN
        run: |
          curl -s -X POST "https://graph.facebook.com/v21.0/${{ secrets.INSTAGRAM_ACCOUNT_ID }}/media" \
            -d "media_type=REELS" -d "upload_type=resumable" -d "share_to_feed=false" \
            -d "access_token=${{ secrets.FACEBOOK_ACCESS_TOKEN }}" -d "caption=diag test"
          echo ""
